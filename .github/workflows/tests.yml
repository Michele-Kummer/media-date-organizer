name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python }} on Windows
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        # The oldest version the plugin supports, and a current one
        python: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install the Python packages
        run: python -m pip install -r requirements.txt
      - name: Install ExifTool, so the video date tests run
        # Chocolatey reports success even when its feed times out and nothing
        # is installed, which silently skips the video tests. Retry, then fail
        # the step if organize.py still can't find ExifTool.
        run: |
          $find = "import sys; sys.path.insert(0, 'skills/media-date-organizer/scripts'); import organize; exe = organize._find_exiftool(); print('ExifTool:', exe); sys.exit(0 if exe else 1)"
          foreach ($try in 1..3) {
            choco install exiftool --yes --no-progress
            $env:PATH = [Environment]::GetEnvironmentVariable('PATH', 'Machine') + ';' + $env:PATH
            python -c $find
            if ($LASTEXITCODE -eq 0) { exit 0 }
            Write-Host "ExifTool is not installed yet (attempt $try of 3)"
            Start-Sleep -Seconds 20
          }
          exit 1
      - name: Run the tests
        run: python -m unittest discover tests -v
