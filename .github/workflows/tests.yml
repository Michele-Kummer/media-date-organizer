name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python }} on Windows
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        # The oldest version the plugin supports, and a current one
        python: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install the Python packages
        run: python -m pip install -r requirements.txt
      - name: Install ExifTool, so the video date tests run
        run: choco install exiftool --yes --no-progress
      - name: Run the tests
        run: python -m unittest discover tests -v
