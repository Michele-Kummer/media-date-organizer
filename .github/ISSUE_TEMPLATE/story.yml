name: User story
description: A requirement, written from the point of view of the person it is for.
labels: ["user story"]
type: Feature
body:
  - type: markdown
    attributes:
      value: |
        Give it a short title that names what the person can do, such as `Choose the JPEG quality`.
        After you create it, add a priority label (`P1: Critical` to `P4: Low`), and add it to its epic as a sub-issue.
  - type: dropdown
    id: epic
    attributes:
      label: Epic
      options:
        - "Setup and getting started (#1)"
        - "Workflow, safety and record-keeping (#2)"
        - "Correct file types and dates (#3)"
        - "Clear out files that aren't real photos or videos (#4)"
        - "Organize folders (#5)"
        - "Check and report, without changing anything (#6)"
        - "Maintain the plugin (#7)"
        - "Desktop app (#71)"
    validations:
      required: true
  - type: dropdown
    id: persona
    attributes:
      label: Who it is for
      description: "Media owner: photos and videos. Photo owner: photos only. Maintainer: whoever changes or tests the plugin."
      options:
        - Media owner
        - Photo owner
        - Maintainer
    validations:
      required: true
  - type: textarea
    id: story
    attributes:
      label: User story
      placeholder: "As a media owner, I want ..., so that ..."
    validations:
      required: true
  - type: textarea
    id: criteria
    attributes:
      label: Acceptance criteria
      description: One bullet for each thing that must hold, saying how it behaves when it is done.
      placeholder: |
        - `--example` previews by default and changes files only with `--apply`.
        - ...
    validations:
      required: true
  - type: dropdown
    id: priority
    attributes:
      label: Priority
      options:
        - "P1: Critical"
        - "P2: High"
        - "P3: Medium"
        - "P4: Low"
    validations:
      required: true
  - type: dropdown
    id: status
    attributes:
      label: Status
      description: "Done when every criterion holds. Partly done when some do not: edit the story afterwards to add a line such as **Status:** Partly done. <the gap> (#57), naming the issues it waits on, and the story closes by itself once they are all fixed."
      options:
        - Not started
        - Partly done
        - Done
      default: 0
